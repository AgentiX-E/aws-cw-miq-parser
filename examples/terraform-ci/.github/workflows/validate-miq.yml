name: Validate MIQ Queries

on:
  pull_request:
    paths:
      - '**/*.tf'
      - '**/*.miq'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Validate MIQ queries
        run: npx tsx scripts/validate-queries.ts terraform/
